name: Deploy health

on:
  deployment_status:

jobs:
  health:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the deployed commit
        env:
          # GitHub's environment_url is the unique deployment host. Vercel
          # Authentication answers that host with a login page. Production
          # traffic uses the public alias, which is what this check proves.
          ORIGIN: https://ferzos-website.vercel.app
          SHA: ${{ github.event.deployment.sha }}
        run: node --experimental-strip-types tools/control-ferzos-website.mts health --origin "$ORIGIN" --sha "$SHA"
